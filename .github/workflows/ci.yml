name: Continuos Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
        
      - name: Copy the project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: latest
      
      - name: Install dependencies
        run: poetry run poetry install
      
      - name: Run ruff format
        run: poetry run task format
      
      - name: Run tests
        env:
          MAX_VALUE_LOANS: ${{ secrets.MAX_VALUE_LOANS }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES_TIME: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES_TIME }}
          TOKEN_SECRET_KEY: ${{ secrets.TOKEN_SECRET_KEY }}
          POSTGRES_USER : fake_user
          POSTGRES_DB : fake_db
          POSTGRES_PASSWORD : fake_password
          DATABASE_URL : 'postgresql+psycopg://fake_user:fake_password@fake_local:5432/fake_db'
        run: poetry run task test

